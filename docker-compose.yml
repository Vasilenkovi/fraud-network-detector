services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fraudgraph
      POSTGRES_USER: fraudgraph
      POSTGRES_PASSWORD: fraudgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudgraph -d fraudgraph"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"

  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/fraudgraph123
    ports:
      - "7474:7474" # Веб-интерфейс Neo4j Browser
      - "7687:7687" # Bolt-протокол для Python-драйвера
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
