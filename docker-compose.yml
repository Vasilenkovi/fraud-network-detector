services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fraudgraph
      POSTGRES_USER: fraudgraph
      POSTGRES_PASSWORD: fraudgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudgraph -d fraudgraph"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"

volumes:
  pgdata: